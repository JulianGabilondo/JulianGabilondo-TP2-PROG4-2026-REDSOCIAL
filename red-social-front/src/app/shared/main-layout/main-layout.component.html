<header class="navbar">
  <a class="marca" routerLink="/publicaciones">Red Social</a>

  <nav>
    <a routerLink="/publicaciones" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Publicaciones</a>
    <a routerLink="/perfil" routerLinkActive="activo">Mi perfil</a>
    <!-- SPRINT 4: enlaces del dashboard, solo se muestran a los administradores -->
    <a *appSoloAdmin routerLink="/dashboard/usuarios" routerLinkActive="activo">Usuarios</a>
    <a *appSoloAdmin routerLink="/dashboard/estadisticas" routerLinkActive="activo">Estadísticas</a>
  </nav>

  <div class="usuario">
    @if (auth.usuario(); as u) {
      <span>{{ u.nombreUsuario }}</span>
      @if (u.fotoPerfil) {
        <img class="avatar avatar-chico" [src]="u.fotoPerfil" alt="Tu foto de perfil" />
      } @else {
        <div class="avatar avatar-chico">{{ u.nombre.charAt(0) }}{{ u.apellido.charAt(0) }}</div>
      }
    }
    <button type="button" class="btn btn-ghost" (click)="salir()">Salir</button>
  </div>
</header>

<main class="contenedor">
  <router-outlet />
</main>

<!-- SPRINT 3: aviso de que quedan 5 minutos de sesión (confirmar = extender la sesión) -->
<app-modal
  [datos]="session.aviso()"
  (cerrar)="session.descartarAviso()"
  (aceptar)="session.extender()"
/>
